# Pyrefly konfigurasyonu
# Pyrefly Microsoft Python extension'in interpreter setting'ini okumaz; kendi
# config'ini ister. Bu dosya .venv site-packages'i (websocket-client, customtkinter,
# opencv, vs.) cozmesini saglar.
#
# Hata: "Cannot find module websocket" -> .venv'e bakmamasinin sonucu.
# Cozum: asagidaki python-interpreter-path Pyrefly'e .venv'i tanitir.

project-includes = ["pc"]
python-interpreter-path = ".venv/Scripts/python.exe"
